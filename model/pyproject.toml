[project]
name = "hometally-model"
version = "0.1.0"
description = "Receipt category classifier for HomeTally: NumPy feature hashing + a small Keras model exported to TensorFlow Lite."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "tensorflow>=2.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hometally_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
